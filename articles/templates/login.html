{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Django Public Blog - Вход</title>

    <link
        rel="stylesheet"
        href="{% static 'articles/css/article.css' %}"
    >
</head>

<body class="auth-page">

    <div class="header">

        <img
            src="{% static 'articles/logo.svg' %}"
            alt="Django Public Blog"
        >

        <div class="site-nav">
            <a href="{% url 'archive' %}">Все записи</a>
            <a href="{% url 'register' %}">Регистрация</a>
        </div>

    </div>

    <div class="content">

        <h1>Вход в аккаунт</h1>

        <p class="form-description">
            Введите логин и пароль для авторизации.
        </p>

        <form method="POST" class="form-panel" novalidate>

            {% csrf_token %}

            <label for="username">
                Логин:
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Введите логин"
                autocomplete="username"
                value="{{ form.username }}"
            >

            <label for="password">
                Пароль:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Введите пароль"
                autocomplete="current-password"
            >

            <button type="submit" class="submit-button">
                Войти
            </button>

        </form>

        {% if form.errors %}

            <div class="form-errors">
                {{ form.errors }}
            </div>

        {% endif %}

        <p class="form-footer">
            Нет аккаунта?
            <a href="{% url 'register' %}">Зарегистрироваться</a>
        </p>

    </div>

</body>
</html>
